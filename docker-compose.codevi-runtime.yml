services:
  advanced-pyexamine-service:
    build:
      context: ./services/advanced-pyexamine
    image: advanced-pyexamine-service:local
    environment:
      ADVANCED_PYEXAMINE_SOURCE_DIR: /opt/advanced-pyexamine-source
      # 분석 허용 루트 — 이 밖의 projectPath는 403
      ADVANCED_PYEXAMINE_ALLOWED_ROOTS: /opt/advanced-pyexamine-source
      # 설정 시 /analyze가 X-Internal-Token 헤더를 요구한다.
      # CodeVi backend가 헤더를 보내도록 배포된 뒤 값을 채울 것 (미설정 시 인증 생략).
      ADVANCED_PYEXAMINE_SHARED_SECRET: ${ADVANCED_PYEXAMINE_SHARED_SECRET:-}
    volumes:
      - "${ADVANCED_PYEXAMINE_HOST_SOURCE_DIR:?Set ADVANCED_PYEXAMINE_HOST_SOURCE_DIR to the pyexamine repository root}:/opt/advanced-pyexamine-source:ro"
    # shared-net의 다른 컨테이너가 분석 요청으로 자원을 소진시키지 못하게 상한 설정
    cpus: 1.0
    mem_limit: 1g
    networks:
      shared-net:
        aliases:
          - advanced-pyexamine-service
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  shared-net:
    external: true
