services:
  advanced-pyexamine-service:
    build:
      context: ./services/advanced-pyexamine
    image: advanced-pyexamine-service:local
    environment:
      ADVANCED_PYEXAMINE_SOURCE_DIR: /opt/advanced-pyexamine-source
      ADVANCED_PYEXAMINE_ALLOWED_ROOTS: /opt/advanced-pyexamine-source
      ADVANCED_PYEXAMINE_SHARED_SECRET: ${ADVANCED_PYEXAMINE_SHARED_SECRET:-compose-example-secret}
    volumes:
      - "${ADVANCED_PYEXAMINE_HOST_SOURCE_DIR:?Set ADVANCED_PYEXAMINE_HOST_SOURCE_DIR to the advanced_pyexamine repository root}:/opt/advanced-pyexamine-source:ro"
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mcp-server:
    build:
      context: .
    image: code-smell-detection-mcp:local
    depends_on:
      advanced-pyexamine-service:
        condition: service_healthy
    environment:
      ADVANCED_PYEXAMINE_MODE: http
      ADVANCED_PYEXAMINE_SERVICE_URL: http://advanced-pyexamine-service:18080
      ADVANCED_PYEXAMINE_SHARED_SECRET: ${ADVANCED_PYEXAMINE_SHARED_SECRET:-compose-example-secret}
