name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - init/mcp-port

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run advanced pyexamine error case tests
        run: npm run test:advanced-pyexamine:errors

      - name: Lint
        run: npm run lint || true

      - name: Run MCP stdio smoke test
        run: npm run test:stdio
